server:
  port: 18081

spring:
  application:
    name: octopus-demo-api-admin

bff:
  routes:
    system:
      - /api/auth
      - /api/users
      - /api/roles
      - /api/menus
      - /api/configs
      - /api/dicts
      - /api/jobs
      - /api/logs
